services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: licitaradar
      POSTGRES_USER: licitaradar
      POSTGRES_PASSWORD: licitaradar_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licitaradar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
